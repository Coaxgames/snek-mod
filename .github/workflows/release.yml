name: Build and release mod

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump mod version
        id: version
        run: |
          python - <<'PY'
          import os
          import re
          from decimal import Decimal
          from pathlib import Path

          manifest = Path("mod.hjson")
          contents = manifest.read_text()
          match = re.search(r"(?m)^version:\s*([0-9]+(?:\.[0-9]+)?)\s*$", contents)
          if match is None:
              raise SystemExit("Could not find a numeric version in mod.hjson")

          version = f"{Decimal(match.group(1)) + Decimal('0.01'):.2f}"
          contents = contents[:match.start(1)] + version + contents[match.end(1):]
          manifest.write_text(contents)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mod.hjson
          git commit -m "Bump mod version to ${VERSION} [skip ci]"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: Package mod
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          asset="ContainerChaining-${VERSION}.zip"
          zip -r "$asset" mod.hjson scripts icon.png
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" "$ASSET" \
            --title "${VERSION}" \
            --notes "Automated release for mod version ${VERSION}."
